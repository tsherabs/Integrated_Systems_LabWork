
# Purpose: Release Notice Board v1.1.0 using Recreate.
# Apply: kubectl apply -f manifests/rolling/deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-board
  namespace: nb-02230126
  labels:
    app: notice-board
spec:
  # Keep three application replicas.
  replicas: 3

  # Recreate terminates old replicas before creating new ones.
  strategy:
    type: RollingUpdate
    rollingUpdate: 
      maxUnavailable: 0 
      maxSurge: 1
  minReadySeconds: 5


  selector:
    matchLabels:
      app: notice-board

  template:
    metadata:
      labels:
        app: notice-board
        # Label Pods with the new application version.
        version: "1.1.0"
      annotations:
        # Records why this deployment revision was created.
        kubernetes.io/change-cause: "Task 5 Recreate release to 1.1.0"

    spec:
      containers:
        - name: notice-board
          image: notice-board:02230126-1.1.0

          # Only use images previously loaded into kind.
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8080

          # Stay within the namespace quota.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          # Only ready application instances receive requests.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3

          # Liveness checks /version, not /healthz, because
          # /healthz intentionally fails during application warm-up.
          livenessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
