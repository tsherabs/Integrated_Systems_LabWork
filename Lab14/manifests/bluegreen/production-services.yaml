
# Purpose: Route production traffic to blue.
# Apply: kubectl apply -f manifests/bluegreen/production-services.yaml

apiVersion: v1
kind: Service
metadata:
  name: notice-board
  namespace: nb-02230126
spec:
  type: ClusterIP
  selector:
    app: notice-board
    # Initially, only blue receives production traffic.
    slot: green
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
# Purpose: Expose the same production slot on localhost:30090.
# Apply: kubectl apply -f manifests/bluegreen/production-services.yaml

apiVersion: v1
kind: Service
metadata:
  name: notice-board-ext
  namespace: nb-02230126
spec:
  type: NodePort
  selector:
    app: notice-board
    slot: green
  ports:
    - name: http
      port: 80
      targetPort: http
      # Reuse the existing kind host-port mapping.
      nodePort: 30090
      protocol: TCP
