
# Purpose: Test a failed Notice Board release using Kubernetes.
# Apply: kubectl apply -f manifests/rolling/deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-board
  namespace: nb-02230126
  labels:
    app: notice-board
    cte412/release-group: notice-board-workload
  annotations:
    # Record the reason for this failed-release revision.
    kubernetes.io/change-cause: "Task 6 broken release 1.1.0"

spec:
  # Maintain three desired application replicas.
  replicas: 3

  # Report a failed rollout after 60 seconds without progress.
  progressDeadlineSeconds: 60

  # New Pods must remain ready for five seconds.
  minReadySeconds: 5

  # Preserve the three existing healthy replicas.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Do not voluntarily remove any available old replica.
      maxUnavailable: 0

      # Allow one additional Pod during the update.
      maxSurge: 1

  selector:
    matchLabels:
      app: notice-board

  template:
    metadata:
      labels:
        app: notice-board
        # Identify the broken release in the Pod labels.
        version: "1.1.0"
      annotations:
        # Record the Pod-template revision's change-cause.
        kubernetes.io/change-cause: "Task 6 broken release 1.1.0"

    spec:
      containers:
        - name: notice-board

          # This image intentionally never becomes healthy.
          image: notice-board:02230126-1.1.0

          # Images must already exist on kind nodes.
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8080

          # Keep resources within namespace quota.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          # Broken release fails this readiness probe forever.
          # Therefore, it must not receive production traffic.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3

          # Check /version rather than /healthz.
          # A failed readiness check must not automatically
          # restart the container during warm-up.
          livenessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
