services:
  web:
    build: . 
    ports: 
      - "5001:5000"
    environment:
      LIBRARY_NAME: "CST Library"
    depends_on:
      redis: 
        condition: service_healthy

    restart: unless-stopped
  redis: 
    image: redis:7-alpine
    volumes:
      - redis_data:/data 
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    
    restart: unless-stopped
      
volumes:
  redis_data: 